# CCMS Nginx Site Configuration with SSL
# This file is placed in /etc/nginx/sites-enabled/ (inside the http{} block).
# Only server{} blocks go here — http-level directives live in /etc/nginx/nginx.conf.

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name ccms.pixelspot.in;

        # Allow Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS Server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name ccms.pixelspot.in;

        # SSL certificates
        ssl_certificate /etc/letsencrypt/live/ccms.pixelspot.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ccms.pixelspot.in/privkey.pem;

        # HSTS — preload requires manual submission to hstspreload.org once this
        # domain is confirmed to serve HTTPS-only indefinitely.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(self)" always;
        # CSP: allow the API/SignalR origin (self, same host different port not
        # needed since nginx proxies same-origin), YouTube embed on the landing
        # page, Google Fonts, and the frontend's own inline styles (MUI).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; media-src 'self' https: blob:; connect-src 'self' wss: https:; frame-src https://www.youtube.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

        # Stricter rate limit on auth endpoints — brute-force protection
        location /api/v1/auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://127.0.0.1:5000/api/v1/auth/login;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SignalR hub proxy (must be before /api/ to match /api/hubs/ first)
        location /api/hubs/ {
            proxy_pass http://127.0.0.1:5000/hubs/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_buffering off;
        }

        # API proxy to backend
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://127.0.0.1:5000/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_buffering off;
            client_max_body_size 100M;
        }

        # SignalR hub proxy (legacy path)
        location /hubs/ {
            proxy_pass http://127.0.0.1:5000/hubs/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_buffering off;
        }

        # R2 media proxy — serves Cloudflare R2 content through the same origin
        # This eliminates CORS issues for browser video playback and adds caching.
        # Frontend receives URLs like /media/uploads/... which nginx proxies to R2.
        location /media/ {
            # Use dynamic DNS resolution to prevent nginx startup failures
            resolver 1.1.1.1 8.8.8.8 valid=300s;
            resolver_timeout 5s;
            set $r2_upstream "pub-c37d8aeca6e04cb7bb13a43d90d86fd6.r2.dev";

            # IMPORTANT: when proxy_pass contains a variable, nginx does NOT
            # automatically strip the matched location prefix. Without this
            # rewrite, R2 receives "/media/uploads/..." (→ 404) instead of
            # "/uploads/...". Do not remove unless you switch back to a
            # static (non-variable) proxy_pass target.
            rewrite ^/media/(.*)$ /$1 break;
            proxy_pass https://$r2_upstream;
            
            # Required for HTTPS upstream
            proxy_ssl_server_name on;
            proxy_set_header Host pub-c37d8aeca6e04cb7bb13a43d90d86fd6.r2.dev;
            
            # Pass through range requests for video seeking/partial content
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            
            # Hide R2's own CORS headers and add ours for consistency
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            add_header Access-Control-Allow-Origin "https://ccms.pixelspot.in" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Max-Age "86400" always;
            
            # Cache video content on the VPS to reduce R2 roundtrips
            proxy_cache_valid 200 206 7d;
            proxy_cache_valid 404 1m;
            expires 7d;
            add_header X-Cache-Status $upstream_cache_status;
            
            # Support large video files
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            
            # Handle CORS preflight
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "https://ccms.pixelspot.in" always;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Range, If-Range" always;
                add_header Access-Control-Max-Age "86400" always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        # Frontend - proxy to Docker container
        location / {
            proxy_pass http://127.0.0.1:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }


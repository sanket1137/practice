<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelSpot Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; width: 1920px; height: 1080px; font-family: sans-serif; }

    /* Player */
    #player-container { position: fixed; inset: 0; }
    #player-video, #player-image { width: 100%; height: 100%; object-fit: contain; }

    /* Pairing overlay */
    #pairing-container {
      position: fixed; inset: 0;
      background: #0f172a;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      color: #fff;
    }
    #pairing-code {
      font-size: 72px;
      font-weight: 700;
      letter-spacing: 16px;
      font-family: monospace;
      color: #6366f1;
    }
    #pairing-status { color: #94a3b8; font-size: 18px; }
    .manual-entry { display: flex; gap: 12px; margin-top: 16px; }
    .manual-entry input {
      font-size: 24px; padding: 8px 16px;
      background: #1e293b; color: #fff;
      border: 1px solid #334155; border-radius: 8px;
      text-transform: uppercase; letter-spacing: 4px; width: 200px;
    }
    .manual-entry button {
      padding: 8px 24px; font-size: 18px;
      background: #6366f1; color: #fff;
      border: none; border-radius: 8px; cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Player -->
  <div id="player-container" style="display:none">
    <video id="player-video" autoplay muted playsinline style="display:none"></video>
    <img id="player-image" style="display:none" alt="" />
  </div>

  <!-- Pairing -->
  <div id="pairing-container">
    <div style="font-size:28px; font-weight:700;">PixelSpot Player</div>
    <canvas id="qr-canvas"></canvas>
    <div id="pairing-code">------</div>
    <div id="pairing-status">Scan QR or enter code at ccms.pixelspot.in</div>
    <div class="manual-entry">
      <input id="manual-code-input" type="text" maxlength="6" placeholder="XXXXXX" />
      <button onclick="Pairing.submitManualCode()">Pair</button>
    </div>
    <span id="fingerprint" style="display:none">lgwebos-device</span>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="secureStorage.js"></script>
  <script src="pairing.js"></script>
  <script src="player.js"></script>
</body>
</html>

# Content-Security-Policy notes:
# - script-src: 'self' + cdn.tailwindcss.com + code.iconify.design cover the external
#   scripts index.html (the standalone cinematic landing page) loads. Its three inline
#   <script> blocks are allow-listed by exact SHA-256 hash instead of 'unsafe-inline' —
#   this is deliberately stricter: an XSS payload that injects a NEW inline script still
#   gets blocked, since only these three exact script bodies are trusted. The React app
#   (app.html) needs no inline-script allowance at all; Vite's output is external modules.
#   MAINTENANCE: if index.html's inline scripts are ever edited, regenerate the three
#   hashes (sha256, base64) and update both add_header lines below, or the landing page's
#   scripts will silently stop running under CSP enforcement.
# - style-src 'unsafe-inline': required by MUI (Emotion injects inline styles) and the
#   landing page inline <style>. fonts.googleapis.com serves the Inter font CSS.
# - connect-src https: wss:: API (same-origin via /api proxy), SignalR websockets,
#   Sentry ingest, iconify icon API, map tile servers.
# - frame-src youtube.com: landing page background video embed.

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
    gzip_comp_level 6;

    # Security headers (repeated in locations that use add_header, because nginx
    # add_header directives in a location block replace ALL inherited headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://code.iconify.design 'sha256-MQFCyQ1GwktkId1QY6AMRW/UeqKXxOQsuCzOsErzfQc=' 'sha256-hqOKaSEUhEzZvHdjA2OlIskRVwLm5SkstgVGw6ALDzM=' 'sha256-U5LPDBU0/ATJRjQJFEoLJt7qgOUt5Gvdq+kczp8+5fE='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # SignalR hub proxy (must be before /api/ to match /api/hubs/ first)
    location /api/hubs/ {
        proxy_pass http://ccms-backend:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://ccms-backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
        client_max_body_size 100M;
    }

    # SignalR hub proxy (legacy path)
    location /hubs/ {
        proxy_pass http://ccms-backend:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # Cache static assets with content hashes (Vite adds hashes to filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # SPA routing - serve app.html for all non-file app routes so React Router handles /login, /dashboard, etc.
    # Root '/' serves index.html via the index directive.
    location / {
        try_files $uri $uri/ /app.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://code.iconify.design 'sha256-MQFCyQ1GwktkId1QY6AMRW/UeqKXxOQsuCzOsErzfQc=' 'sha256-hqOKaSEUhEzZvHdjA2OlIskRVwLm5SkstgVGw6ALDzM=' 'sha256-U5LPDBU0/ATJRjQJFEoLJt7qgOUt5Gvdq+kczp8+5fE='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

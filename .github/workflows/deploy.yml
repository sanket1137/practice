name: Deploy to Production

# Runs when a PR is merged into master, or manually via the Actions tab.
# A PR that is closed WITHOUT merging must NOT deploy — that's what the
# `if: github.event.pull_request.merged == true` guard on the deploy job is for.
on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you triggering a manual deploy?"
        required: false
        default: "Manual deploy"

jobs:
  # Gate: nothing deploys unless build + tests pass. Reuses the same checks
  # a PR already had to pass, so a merge that somehow slipped through with a
  # stale/bypassed check still gets caught here before touching production.
  ci:
    name: Run CI checks
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    environment: production

    env:
      REMOTE_PATH: /opt/ccms
      IMAGE_TAG: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      # Deploy mechanics — server location/user, never hardcoded in code.
      SERVER_IP: ${{ secrets.SERVER_IP }}
      REMOTE_USER: ${{ vars.DEPLOY_USER || 'root' }}
      PRODUCTION_URL: ${{ vars.FRONTEND_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ]; then
            # Pinned host key — set this repo secret once via:
            #   ssh-keyscan -H <server-ip> > known_hosts   (verify the fingerprint
            #   out-of-band, e.g. against the host's console/rescue system, before trusting it)
            echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS secret not set — falling back to ssh-keyscan," \
                 "which trusts whatever host answers on first connect (MITM-able). Set the" \
                 "secret to pin the host key instead."
            ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
          fi

      # Every application credential is generated here, from GitHub Actions
      # Secrets/Variables, into a file that only ever exists on the runner's
      # ephemeral disk (auto-destroyed after the job) and on the server's
      # /opt/ccms/.env (never committed, never logged — GitHub masks every
      # ${{ secrets.* }} value that appears in step output).
      - name: Render production .env
        run: |
          cat > "$RUNNER_TEMP/.env.production" <<EOF
          # Generated by .github/workflows/deploy.yml — do not edit on the server,
          # edit the GitHub Actions Secrets/Variables instead and redeploy.
          ASPNETCORE_ENVIRONMENT=Production

          # Database (Neon PostgreSQL)
          POSTGRES_CONNECTION_STRING=${{ secrets.POSTGRES_CONNECTION_STRING }}

          # Storage (Cloudflare R2)
          R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME=${{ vars.R2_BUCKET_NAME }}
          R2_PUBLIC_URL_BASE=${{ vars.R2_PUBLIC_URL_BASE }}
          R2_ADMIN_ACCESS_KEY_ID=${{ secrets.R2_ADMIN_ACCESS_KEY_ID }}
          R2_ADMIN_SECRET_ACCESS_KEY=${{ secrets.R2_ADMIN_SECRET_ACCESS_KEY }}

          # JWT
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}

          # Payments (Razorpay)
          RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET=${{ secrets.RAZORPAY_WEBHOOK_SECRET }}

          # Google Places / Maps
          GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY }}
          VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

          # Error tracking
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}

          # WebRTC TURN server
          TURN_SERVER_URL=${{ vars.TURN_SERVER_URL }}
          TURN_USERNAME=${{ secrets.TURN_USERNAME }}
          TURN_PASSWORD=${{ secrets.TURN_PASSWORD }}

          # Email (AWS SES / SMTP)
          AWS_SES_ACCESS_KEY_ID=${{ secrets.AWS_SES_ACCESS_KEY_ID }}
          AWS_SES_SECRET_ACCESS_KEY=${{ secrets.AWS_SES_SECRET_ACCESS_KEY }}
          AWS_SES_REGION=${{ vars.AWS_SES_REGION }}
          AWS_SES_FROM_EMAIL=${{ vars.AWS_SES_FROM_EMAIL }}
          SMTP_HOST=${{ vars.SMTP_HOST }}
          SMTP_PORT=${{ vars.SMTP_PORT }}
          SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL=${{ vars.SMTP_FROM_EMAIL }}
          SMTP_ENABLE_SSL=${{ vars.SMTP_ENABLE_SSL }}

          # SMS (ComBirds)
          COMBIRDS_API_KEY=${{ secrets.COMBIRDS_API_KEY }}
          COMBIRDS_SENDER_ID=${{ vars.COMBIRDS_SENDER_ID }}
          COMBIRDS_TEMPLATE_ID=${{ vars.COMBIRDS_TEMPLATE_ID }}
          COMBIRDS_USER_ID=${{ secrets.COMBIRDS_USER_ID }}
          COMBIRDS_PASSWORD=${{ secrets.COMBIRDS_PASSWORD }}

          # App URLs
          FRONTEND_URL=${{ vars.FRONTEND_URL }}
          DOMAIN=${{ vars.DOMAIN }}
          EOF
          chmod 600 "$RUNNER_TEMP/.env.production"

      - name: Upload .env to server
        run: |
          scp -i ~/.ssh/deploy_key "$RUNNER_TEMP/.env.production" \
            "$REMOTE_USER@$SERVER_IP:$REMOTE_PATH/.env"
          shred -u "$RUNNER_TEMP/.env.production" 2>/dev/null || rm -f "$RUNNER_TEMP/.env.production"

      - name: Create backend archive
        run: |
          tar -cf backend-src.tar \
            --exclude="bin" --exclude="obj" --exclude="publish" \
            --exclude="uploads" --exclude="wwwroot" --exclude=".vs" \
            --exclude="*.user" --exclude="TempClean" --exclude="TempDbCreate" \
            backend

      - name: Create frontend archive
        run: |
          tar -cf frontend-src.tar \
            --exclude="node_modules" --exclude="dist" --exclude=".vite" \
            frontend

      - name: Create infra archive
        run: tar -cf infra.tar docker-compose.production.yml nginx/

      - name: Upload archives to server
        run: |
          scp -i ~/.ssh/deploy_key \
            backend-src.tar frontend-src.tar infra.tar \
            "$REMOTE_USER@$SERVER_IP:$REMOTE_PATH/"

      - name: Backup database before deploy
        run: |
          ssh -i ~/.ssh/deploy_key "$REMOTE_USER@$SERVER_IP" << BACKUP_SCRIPT
            set -e
            cd $REMOTE_PATH
            mkdir -p backups
            set -a; source .env; set +a
            if [ -n "\$POSTGRES_CONNECTION_STRING" ]; then
              pg_dump "\$POSTGRES_CONNECTION_STRING" > backups/ccms_backup_\$(date +%Y%m%d_%H%M%S).sql
              ls -1t backups/ccms_backup_*.sql | tail -n +15 | xargs -r rm --
            else
              echo "WARN: POSTGRES_CONNECTION_STRING not set, skipping backup"
            fi
          BACKUP_SCRIPT

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key "$REMOTE_USER@$SERVER_IP" "IMAGE_TAG='$IMAGE_TAG' bash -s" << 'DEPLOY_SCRIPT'
            set -e
            cd /opt/ccms

            # Remove shipped source trees first: tar only adds/overwrites, so
            # locally-deleted files would otherwise persist on the server and
            # can break the Docker build. Root-level state (.env, uploads/,
            # backups/, .deployed_tags) is untouched.
            rm -rf backend frontend nginx

            # Extract archives
            tar -xf backend-src.tar
            tar -xf frontend-src.tar
            tar -xf infra.tar
            rm -f backend-src.tar frontend-src.tar infra.tar

            # Host nginx config (TLS termination happens outside Docker)
            cp nginx/ssl-nginx.conf /etc/nginx/sites-available/ccms.conf
            ln -sf /etc/nginx/sites-available/ccms.conf /etc/nginx/sites-enabled/ccms.conf
            nginx -t
            systemctl reload nginx

            # Rebuild and restart containers, tagged for rollback. --env-file is
            # explicit (rather than relying on compose's cwd auto-load) so this
            # always uses the .env this workflow just uploaded.
            export IMAGE_TAG
            docker compose --env-file .env -f docker-compose.production.yml build
            docker compose --env-file .env -f docker-compose.production.yml up -d

            echo "$IMAGE_TAG" >> .deployed_tags
            tail -n 5 .deployed_tags > .deployed_tags.tmp && mv .deployed_tags.tmp .deployed_tags

            # Only prune dangling layers — never the images backing recent deploys
            docker image prune -f

            echo "Deployment complete!"
          DEPLOY_SCRIPT

      - name: Verify deployment
        run: |
          sleep 15
          ssh -i ~/.ssh/deploy_key "$REMOTE_USER@$SERVER_IP" \
            "curl -sf http://localhost:5000/health/ready"

      - name: Public health check
        if: env.PRODUCTION_URL != ''
        run: curl -f "${PRODUCTION_URL%/}/health" || exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key "$REMOTE_USER@$SERVER_IP" << 'ROLLBACK_SCRIPT'
            set -e
            cd /opt/ccms
            if [ -f .deployed_tags ] && [ $(wc -l < .deployed_tags) -ge 2 ]; then
              PREVIOUS_TAG=$(tail -n 2 .deployed_tags | head -n 1)
              echo "Deployment verification failed — rolling back to $PREVIOUS_TAG"
              export IMAGE_TAG=$PREVIOUS_TAG
              docker compose --env-file .env -f docker-compose.production.yml up -d
            else
              echo "No previous tag recorded — manual intervention required."
            fi
          ROLLBACK_SCRIPT

# CCMS Docker Compose Configuration
# Production deployment for Hetzner server with Neon PostgreSQL + Cloudflare R2

services:
  # Backend API (.NET 8)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ccms-backend:${IMAGE_TAG:-latest}
    container_name: ccms-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      # Database (Neon PostgreSQL)
      - Database__Provider=PostgreSQL
      - ConnectionStrings__PostgresConnection=${POSTGRES_CONNECTION_STRING}
      # Storage (Cloudflare R2)
      - FileStorage__Provider=R2
      - R2__AccountId=${R2_ACCOUNT_ID}
      - R2__AccessKeyId=${R2_ACCESS_KEY_ID}
      - R2__SecretAccessKey=${R2_SECRET_ACCESS_KEY}
      - R2__BucketName=${R2_BUCKET_NAME:-prod-ccms}
      - R2__PublicUrlBase=${R2_PUBLIC_URL}
      # Admin credentials (optional) - used ONLY for bucket-config operations
      # like PutBucketCors on startup. Keep the runtime token (above) scoped
      # to object-level permissions. If not set, CORS auto-config is skipped.
      - R2__AdminAccessKeyId=${R2_ADMIN_ACCESS_KEY_ID:-}
      - R2__AdminSecretAccessKey=${R2_ADMIN_SECRET_ACCESS_KEY:-}
      # JWT
      - Jwt__SecretKey=${JWT_SECRET_KEY}
      - Jwt__Issuer=PixelCCMS
      - Jwt__Audience=PixelCCMSUsers
      - Jwt__ExpiryMinutes=1440
      # CORS - explicit allow-list only. Plaintext http:// origins are deliberately
      # excluded: AllowCredentials() over http would let a MITM read auth cookies/
      # tokens on the wire. Local dev origins stay for docker-compose-based local use.
      - Cors__AllowedOrigins__0=https://ccms.pixelspot.in
      - Cors__AllowedOrigins__1=http://localhost:3000
      - Cors__AllowedOrigins__2=http://localhost:3100
      # App Settings
      - App__BaseUrl=${FRONTEND_URL:-https://ccms.pixelspot.in}
      - TimeZone__Id=Asia/Kolkata
      # AWS SES (Email)
      - AWS__SES__AccessKeyId=${AWS_ACCESS_KEY_ID}
      - AWS__SES__SecretAccessKey=${AWS_SECRET_ACCESS_KEY}
      - AWS__SES__Region=${AWS_SES_REGION:-ap-south-1}
      - AWS__SES__FromEmail=${AWS_SES_FROM_EMAIL:-noreply@pixelspot.in}
      # ComBirds SMS
      - ComBirds__ApiKey=${COMBIRDS_API_KEY}
      - ComBirds__SenderId=${COMBIRDS_SENDER_ID:-EDUMRC}
      - ComBirds__TemplateId=${COMBIRDS_TEMPLATE_ID}
      - ComBirds__DevelopmentMode=false
    # Bound to loopback only — nginx is the sole public entrypoint. Prevents the
    # unauthenticated-by-nginx API surface from being reachable if the host
    # firewall (ufw) is ever misconfigured or bypassed.
    ports:
      - "127.0.0.1:5000:8080"
    volumes:
      - backend-logs:/app/logs
    networks:
      - ccms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1536M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend (React SPA)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1
        - VITE_SIGNALR_URL=
        - VITE_SENTRY_DSN=${VITE_SENTRY_DSN:-}
        - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY:-}
    image: ccms-frontend:${IMAGE_TAG:-latest}
    container_name: ccms-frontend
    ports:
      - "8080:80"
    networks:
      - ccms-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ccms-network:
    name: ccms-network
    driver: bridge

volumes:
  backend-logs:
    name: ccms-backend-logs

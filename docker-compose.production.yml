# CCMS Production Docker Compose
# Deploy to Hetzner VPS with PostgreSQL (Neon) + R2 Storage
#
# TLS termination for this stack is handled by a HOST-level nginx instance
# (see nginx/README.md and nginx/ssl-nginx.conf), not the commented-out
# nginx/certbot services below. Those are kept only as a documented
# alternative for a fully containerized TLS setup; they are not part of the
# active deployment path.
#
# IMAGE_TAG: set by deploy-production.sh to a timestamp on every deploy so
# `docker compose build` produces a uniquely tagged, rollback-able image
# instead of overwriting the same floating tag. Defaults to "latest" for
# local/manual runs.

services:
  # ===========================================
  # BACKEND API (.NET 8)
  # ===========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ccms-backend:${IMAGE_TAG:-latest}
    container_name: ccms-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      # Database (Neon PostgreSQL)
      - Database__Provider=PostgreSQL
      - ConnectionStrings__PostgresConnection=${POSTGRES_CONNECTION_STRING}
      # Storage (Cloudflare R2)
      - FileStorage__Provider=R2
      - R2__AccountId=${R2_ACCOUNT_ID}
      - R2__AccessKeyId=${R2_ACCESS_KEY_ID}
      - R2__SecretAccessKey=${R2_SECRET_ACCESS_KEY}
      - R2__BucketName=${R2_BUCKET_NAME:-prod-ccms}
      - R2__PublicUrlBase=${R2_PUBLIC_URL}
      # JWT
      - Jwt__SecretKey=${JWT_SECRET_KEY}
      - Jwt__Issuer=PixelCCMS
      - Jwt__Audience=PixelCCMSUsers
      # CORS
      - Cors__AllowedOrigins__0=${FRONTEND_URL:-https://ccms.yourdomain.com}
      - Cors__AllowedOrigins__1=https://pixelspot.in
      - Cors__AllowedOrigins__2=https://www.pixelspot.in
      - Cors__AllowedOrigins__3=https://app.pixelspot.in
      - Cors__AllowedOrigins__4=http://localhost:3100
      # Email (AWS SES / SMTP)
      - AWS__SES__AccessKeyId=${AWS_SES_ACCESS_KEY_ID:-}
      - AWS__SES__SecretAccessKey=${AWS_SES_SECRET_ACCESS_KEY:-}
      - AWS__SES__Region=${AWS_SES_REGION:-ap-south-1}
      - AWS__SES__FromEmail=${AWS_SES_FROM_EMAIL:-contact@pixelspot.in}
      - Smtp__Host=${SMTP_HOST:-}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__Username=${SMTP_USERNAME:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - Smtp__FromEmail=${SMTP_FROM_EMAIL:-contact@pixelspot.in}
      - Smtp__EnableSsl=${SMTP_ENABLE_SSL:-true}
      # SMS (ComBirds)
      - ComBirds__ApiKey=${COMBIRDS_API_KEY:-}
      - ComBirds__SenderId=${COMBIRDS_SENDER_ID:-}
      - ComBirds__TemplateId=${COMBIRDS_TEMPLATE_ID:-}
      - ComBirds__UserId=${COMBIRDS_USER_ID:-}
      - ComBirds__Password=${COMBIRDS_PASSWORD:-}
      # App Settings
      - App__BaseUrl=${FRONTEND_URL:-https://ccms.pixelspot.in}
      - TimeZone__Id=Asia/Kolkata
    ports:
      - "127.0.0.1:5000:80"
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ccms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1536M
        reservations:
          memory: 256M

  # ===========================================
  # FRONTEND (React + Nginx)
  # ===========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${BACKEND_URL:-https://api.ccms.yourdomain.com}
        - VITE_SIGNALR_URL=${BACKEND_URL:-https://api.ccms.yourdomain.com}
        - VITE_SENTRY_DSN=${VITE_SENTRY_DSN:-}
        - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY:-}
    image: ccms-frontend:${IMAGE_TAG:-latest}
    container_name: ccms-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ccms-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
        reservations:
          memory: 64M

